name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Recipe provenance must not be stale
        run: npm run docs:audit

  verify-recipes:
    name: recipes compile against real Angular
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Installs a real Angular v22 so the recipes are checked against the actual
      # @angular/forms, not against a transcription of its docs.
      - run: npm run verify:install
      - run: npm run verify:recipes
